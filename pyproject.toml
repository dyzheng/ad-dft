[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "addft"
version = "0.1.0"
description = "Differentiable periodic DFT kernel (architecture prototype)"
requires-python = ">=3.10"
dependencies = ["jax>=0.4.30", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
